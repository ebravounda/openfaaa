crons:
  - name: purge-vf-log
    description: "Borra el log de conexión VeriFactu-AEAT el día 3 de cada mes a las 03:00"
    cron: "0 3 3 * *"
    endpoint: "{{BASE_URL}}/api/cron/purge-verifactu-log"
    method: POST
    enabled: true
  - name: check-cert-expiry
    description: "Avisa por email a los usuarios cuyo certificado caduca en 30 días (diario 08:00)"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/check-cert-expiry"
    method: POST
    enabled: true
